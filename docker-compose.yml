services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: life_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: build
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      # "postgres" is the service name, resolved over the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/life_tracker?schema=public
    volumes:
      - ./backend:/app
      # Anonymous volume, keeps the image's own node_modules instead of
      # letting the bind mount above shadow it with the host's copy.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
