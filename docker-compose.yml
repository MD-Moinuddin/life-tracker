services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: life_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: build
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      # Service name, not localhost — this container reaches Postgres over
      # the compose network, where "postgres" resolves to that container.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/life_tracker?schema=public
    volumes:
      - ./backend:/app
      # Anonymous volume: keeps the image's own node_modules instead of
      # letting the bind mount above shadow it with the host's copy, which
      # may hold different platform-specific binaries.
      - /app/node_modules
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Read by code running in the browser, so this points at the port
      # mapped to the host, not the backend's in-network service name.
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

# Named so Postgres data survives `docker compose down` / restarts, instead
# of resetting every time the containers are recreated.
volumes:
  postgres_data:
